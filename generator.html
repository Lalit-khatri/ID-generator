<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant ID Card Generator</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to ensure the canvas scales nicely on smaller screens */
        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            background-color: white;
        }
        
        .custom-file-upload {
            display: inline-block;
            padding: 8px 16px;
            cursor: pointer;
            background-color: #f3f4f6;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            transition: all 0.2s ease;
        }

        .custom-file-upload:hover {
            background-color: #e5e7eb;
            border-color: #9ca3af;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">ID Card Generator</h1>
            <p class="text-gray-500">Create and download your custom ID card instantly.</p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Left Column: Input Form -->
            <div class="w-full lg:w-1/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold mb-6 text-gray-800 border-b pb-2">Card Details</h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Header Line 1</label>
                            <input type="text" id="header1" value="AERODROME ENTRY PERMIT" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Header Line 2</label>
                            <input type="text" id="header2" value="BUREAU OF CIVIL AVIATION SECURITY" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                    </div>

                    <!-- Header Logos -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Header Left Logo</label>
                            <label class="custom-file-upload">
                                <span id="logoLeftLabel" class="text-sm">Upload Left Logo</span>
                                <input type="file" id="logoLeftInput" accept="image/*">
                            </label>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Header Right Logo</label>
                            <label class="custom-file-upload">
                                <span id="logoRightLabel" class="text-sm">Upload Right Logo</span>
                                <input type="file" id="logoRightInput" accept="image/*">
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="fullName" value="SHISHUPAL KUMAR" maxlength="30" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Role / Job Title</label>
                        <input type="text" id="roleTitle" value="LOADER" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                        <input type="text" id="companyName" value="BFS IND PVT LT" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">AEP No.</label>
                        <input type="text" id="aepNo" value="DEL2602060106" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Valid From</label>
                            <input type="text" id="validFrom" value="15/05/2026" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Valid Upto</label>
                            <input type="text" id="validUpto" value="02/03/2029" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Airports</label>
                            <input type="text" id="airports" value="DEL" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Terminals</label>
                            <input type="text" id="terminals" value="TERMINAL-3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase">
                        </div>
                    </div>

                    <!-- Custom Grid Block -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Right Grid Values</label>
                        <div class="grid grid-cols-4 gap-2">
                            <input type="text" id="g0" value="A" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-orange-50">
                            <input type="text" id="g1" value="D" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-orange-50">
                            <input type="text" id="g2" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-orange-50">
                            <input type="text" id="g3" value="Si" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-orange-50">
                            
                            <input type="text" id="g4" value="Sd" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g5" value="P" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g6" value="B" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g7" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            
                            <input type="text" id="g8" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g9" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g10" value="I" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            <input type="text" id="g11" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                            
                            <input type="text" id="g12" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-green-50">
                            <input type="text" id="g13" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-green-50">
                            <input type="text" id="g14" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-green-50">
                            <input type="text" id="g15" value="" maxlength="3" class="px-2 py-1 border border-gray-300 rounded-md text-center uppercase focus:ring-2 focus:ring-blue-500 outline-none bg-green-50">
                        </div>
                    </div>

                    <!-- File Uploads -->
                    <div class="pt-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Profile Photo</label>
                        <label class="custom-file-upload">
                            <span id="photoLabel">Upload Photo (JPG/PNG)</span>
                            <input type="file" id="photoInput" accept="image/*">
                        </label>
                    </div>

                    <div class="pt-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Signature</label>
                        <label class="custom-file-upload">
                            <span id="sigLabel">Upload Signature</span>
                            <input type="file" id="sigInput" accept="image/*">
                        </label>
                    </div>
                </div>

                <!-- Action Button -->
                <button onclick="downloadID()" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download ID Card
                </button>
            </div>

            <!-- Right Column: Live Preview (Canvas) -->
            <div class="w-full lg:w-2/3 flex flex-col items-center justify-center bg-gray-50 p-6 rounded-2xl border border-gray-200 overflow-hidden">
                <div class="mb-4 text-sm font-semibold text-gray-500 uppercase tracking-wider">Live Preview</div>
                
                <!-- The Canvas (Updated dimensions to match physical ID ratio) -->
                <canvas id="idCanvas" width="740" height="480"></canvas>
                
                <p class="mt-4 text-xs text-gray-400 text-center">Changes you make on the left are updated here in real-time.<br>No data is sent to any server.</p>
            </div>
            
        </div>
    </div>

    <script>
        // --- Setup & State ---
        const canvas = document.getElementById('idCanvas');
        const ctx = canvas.getContext('2d');

        // State variables to hold image data
        let photoImage = null;
        let signatureImage = null;
        let logoLeftImage = null;
        let logoRightImage = null;

        // --- DOM Elements ---
        const inputs = {
            header1: document.getElementById('header1'),
            header2: document.getElementById('header2'),
            fullName: document.getElementById('fullName'),
            role: document.getElementById('roleTitle'),
            company: document.getElementById('companyName'),
            aepNo: document.getElementById('aepNo'),
            validFrom: document.getElementById('validFrom'),
            validUpto: document.getElementById('validUpto'),
            airports: document.getElementById('airports'),
            terminals: document.getElementById('terminals')
        };
        
        // Grab all 16 grid inputs dynamically
        const gridInputs = [];
        for (let i = 0; i < 16; i++) {
            gridInputs.push(document.getElementById('g' + i));
        }

        const fileInputs = {
            photo: document.getElementById('photoInput'),
            signature: document.getElementById('sigInput'),
            logoLeft: document.getElementById('logoLeftInput'),
            logoRight: document.getElementById('logoRightInput')
        };

        const labels = {
            photo: document.getElementById('photoLabel'),
            signature: document.getElementById('sigLabel'),
            logoLeft: document.getElementById('logoLeftLabel'),
            logoRight: document.getElementById('logoRightLabel')
        };

        // --- Event Listeners ---
        // Redraw canvas whenever text changes
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', drawID);
        });
        
        // Add listeners for all the dynamic grid inputs
        gridInputs.forEach(input => {
            input.addEventListener('input', drawID);
        });

        // Handle Image Uploads
        fileInputs.photo.addEventListener('change', (e) => handleImageUpload(e, 'photo'));
        fileInputs.signature.addEventListener('change', (e) => handleImageUpload(e, 'signature'));
        fileInputs.logoLeft.addEventListener('change', (e) => handleImageUpload(e, 'logoLeft'));
        fileInputs.logoRight.addEventListener('change', (e) => handleImageUpload(e, 'logoRight'));

        // --- Image Upload Handler ---
        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            // Update UI label to show file selected
            if (type === 'photo') labels.photo.innerText = "✓ Photo selected";
            if (type === 'signature') labels.signature.innerText = "✓ Signature selected";
            if (type === 'logoLeft') labels.logoLeft.innerText = "✓ Left Logo Loaded";
            if (type === 'logoRight') labels.logoRight.innerText = "✓ Right Logo Loaded";

            const reader = new FileReader();
            
            // Read file into a data URL
            reader.onload = function(e) {
                const img = new Image();
                
                // Once image is loaded into memory, trigger a redraw
                img.onload = function() {
                    if (type === 'photo') photoImage = img;
                    if (type === 'signature') signatureImage = img;
                    if (type === 'logoLeft') logoLeftImage = img;
                    if (type === 'logoRight') logoRightImage = img;
                    drawID(); // Update the preview
                }
                img.src = e.target.result;
            }
            
            reader.readAsDataURL(file);
        }

        // --- Core Drawing Logic ---
        function drawID() {
            // 1. Clear & Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff'; // White background
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle border to canvas
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 4;
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

            // 2. Draw Header
            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            
            // Calculate true visual center between the two logos 
            // (Left logo is up to 140px wide, right is 80px, so true center shifts right)
            const headerCenterX = 400; 
            
            // Header Line 1
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.fillText(inputs.header1.value.toUpperCase(), headerCenterX, 45);
            
            // Header Line 2
            ctx.font = 'bold 18px Arial, sans-serif';
            ctx.fillText(inputs.header2.value.toUpperCase(), headerCenterX, 75);
            ctx.textAlign = 'left'; // Reset back to default left alignment

            // Draw Header Logos
            if (logoLeftImage) {
                const maxW = 140;
                const maxH = 70;
                const ratio = Math.min(maxW / logoLeftImage.width, maxH / logoLeftImage.height);
                const w = logoLeftImage.width * ratio;
                const h = logoLeftImage.height * ratio;
                ctx.drawImage(logoLeftImage, 35, 10 + (70 - h)/2, w, h);
            }

            if (logoRightImage) {
                const maxW = 80;
                const maxH = 70;
                const ratio = Math.min(maxW / logoRightImage.width, maxH / logoRightImage.height);
                const w = logoRightImage.width * ratio;
                const h = logoRightImage.height * ratio;
                ctx.drawImage(logoRightImage, canvas.width - 35 - w, 10 + (70 - h)/2, w, h);
            }

            // Header Separator Line
            ctx.beginPath();
            ctx.moveTo(0, 90);
            ctx.lineTo(canvas.width, 90);
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Set a base Y offset for everything below the header
            const startY = 110;

            // 3. Draw Profile Photo & Signature (Single Unified Border)
            const boxX = 35;
            const boxW = 190;
            const photoH = 240;
            const sigH = 80;
            const totalBoxH = photoH + sigH;

            // Draw Photo inside the unified box
            if (photoImage) {
                ctx.drawImage(photoImage, boxX, startY, boxW, photoH);
            } else {
                ctx.fillStyle = '#f3f4f6';
                ctx.fillRect(boxX, startY, boxW, photoH);
                ctx.fillStyle = '#9ca3af';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NO PHOTO', boxX + boxW/2, startY + photoH/2);
                ctx.textAlign = 'left';
            }

            // Draw Signature inside the unified box
            const sigY = startY + photoH;
            if (signatureImage) {
                ctx.drawImage(signatureImage, boxX, sigY, boxW, sigH);
            } else {
                // Placeholder squiggly line
                ctx.beginPath();
                ctx.moveTo(boxX + 20, sigY + 40);
                ctx.quadraticCurveTo(boxX + 60, sigY + 10, boxX + 100, sigY + 40);
                ctx.quadraticCurveTo(boxX + 140, sigY + 70, boxX + 180, sigY + 30);
                ctx.strokeStyle = '#9ca3af';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw the SINGLE Unified Outer Border
            ctx.strokeStyle = '#1f2937'; // Solid dark border
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, startY, boxW, totalBoxH);

            // 4. Draw User Information Text (Middle)
            const textX = 240;
            const maxTextWidth = 255; // 550 (grid X) - 240 (text X) - 15 (padding) to prevent overlap
            ctx.fillStyle = '#111827'; 
            
            // Name Wrapping Logic
            ctx.font = 'bold 26px Arial, sans-serif';
            const nameText = inputs.fullName.value.toUpperCase();
            const words = nameText.split(' ');
            let line = '';
            let nameLines = [];
            
            // Calculate how many words fit on each line
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxTextWidth && n > 0) {
                    nameLines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            nameLines.push(line.trim());
            
            // Cap at a maximum of 2 lines
            if (nameLines.length > 2) nameLines = nameLines.slice(0, 2);
            
            // Draw Name lines
            const nameStartY = startY + 35;
            const nameLineHeight = 40;
            for (let i = 0; i < nameLines.length; i++) {
                ctx.fillText(nameLines[i], textX, nameStartY + (i * nameLineHeight));
            }

            // Dynamically shift Role and Company down if Name takes 2 lines
            const offset = (nameLines.length - 1) * nameLineHeight;

            // Helper to truncate text so it doesn't squeeze when overflowing
            function getTruncatedText(text, maxWidth) {
                let truncated = text;
                while (ctx.measureText(truncated).width > maxWidth && truncated.length > 0) {
                    truncated = truncated.slice(0, -1); // Remove the last character until it fits
                }
                return truncated;
            }

            // Draw Role and Company (Truncated to fit maxWidth)
            const roleText = getTruncatedText(inputs.role.value.toUpperCase(), maxTextWidth);
            const companyText = getTruncatedText(inputs.company.value.toUpperCase(), maxTextWidth);

            ctx.fillText(roleText, textX, startY + 80 + offset);
            ctx.fillText(companyText, textX, startY + 120 + offset);

            // Detailed Fields
            ctx.font = 'bold 18px Arial, sans-serif';
            const labelX = textX;
            const colonX = 380; 
            const valueX = 395;

            // Tight vertical spacing for the details block
            const yPos = { aep: startY + 205, val: startY + 240, air: startY + 275, term: startY + 325 };

            // AEP No
            ctx.fillText('AEP No.', labelX, yPos.aep);
            ctx.fillText(':', colonX, yPos.aep);
            ctx.fillText(inputs.aepNo.value.toUpperCase(), valueX, yPos.aep);

            // VALIDITY
            ctx.fillText('VALIDITY', labelX, yPos.val);
            ctx.fillText(':', colonX, yPos.val);
            const validityText = `${inputs.validFrom.value.toUpperCase()} TO ${inputs.validUpto.value.toUpperCase()}`;
            ctx.fillText(validityText, valueX, yPos.val);

            // AIRPORTS
            ctx.fillText('AIRPORTS', labelX, yPos.air);
            ctx.fillText(':', colonX, yPos.air);
            ctx.fillText(inputs.airports.value.toUpperCase(), valueX, yPos.air);

            // TERMINALS
            ctx.fillText('TERMINALS', labelX, yPos.term);
            ctx.fillText(':', colonX, yPos.term);
            ctx.fillText(inputs.terminals.value.toUpperCase(), valueX, yPos.term);


            // 5. Draw The Grid Block (Top Right)
            drawGrid(520, startY);
        }

        function drawGrid(startX, startY) {
            const boxSize = 38;
            const gap = 8;
            
            // Grid Layout definition pulling dynamically from the 16 form inputs
            const gridData = [
                // Row 1 (Orange boxes)
                { text: gridInputs[0].value, bg: '#f5b041' }, { text: gridInputs[1].value, bg: '#f5b041' }, { text: gridInputs[2].value, bg: '#f5b041' }, { text: gridInputs[3].value, bg: '#f5b041' },
                // Row 2 (White boxes)
                { text: gridInputs[4].value, bg: '#ffffff' }, { text: gridInputs[5].value, bg: '#ffffff' }, { text: gridInputs[6].value, bg: '#ffffff' }, { text: gridInputs[7].value, bg: '#ffffff' },
                // Row 3 (White boxes)
                { text: gridInputs[8].value, bg: '#ffffff' }, { text: gridInputs[9].value, bg: '#ffffff' }, { text: gridInputs[10].value, bg: '#ffffff' }, { text: gridInputs[11].value, bg: '#ffffff' },
                // Row 4 (Green boxes)
                { text: gridInputs[12].value, bg: '#58d68d' }, { text: gridInputs[13].value, bg: '#58d68d' }, { text: gridInputs[14].value, bg: '#58d68d' }, { text: gridInputs[15].value, bg: '#58d68d' }
            ];

            let col = 0;
            let row = 0;

            gridData.forEach((box, i) => {
                col = i % 4;
                row = Math.floor(i / 4);
                
                const x = startX + col * (boxSize + gap);
                const y = startY + row * (boxSize + gap);

                // Box background
                ctx.fillStyle = box.bg;
                ctx.fillRect(x, y, boxSize, boxSize);
                
                // Box border
                ctx.strokeStyle = '#1f2937'; // Dark gray/black line
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, boxSize, boxSize);

                // Box text
                if (box.text) {
                    ctx.fillStyle = '#111827';
                    ctx.font = 'bold 18px Arial, sans-serif'; // Reduced font size to match rest of card
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(box.text, x + boxSize/2, y + boxSize/2 + 2); // +2 for vertical optical alignment
                }
            });

            // Reset text alignments after grid draw
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // --- Download Function ---
        function downloadID() {
            // Make sure the canvas is up to date
            drawID();

            // Create a filename based on the user's name
            const safeName = (inputs.fullName.value || 'ID').replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const filename = `${safeName}_id_card.png`;

            // Convert canvas to base64 image data string
            const dataUrl = canvas.toDataURL('image/png');

            // Create a temporary anchor tag, set download attributes, click it, and remove it
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Initialize ---
        // Draw the initial state right away when the page loads
        window.onload = drawID;

    </script>
</body>
</html>
